# herdr の設定。この repo が正本で、install.sh が ~/.config/herdr/config.toml へ張る。
#
# 既定と違う値だけを書く。既定のまま使うものは書かない——書き写すと、
# herdr 側で既定が変わったときに気づけなくなる。
# 既定の全一覧は `herdr --default-config` で引ける。
#
# 意図して書いていないもの:
#   terminal.default_shell  この環境の $SHELL は zsh。書くと pane のシェルが変わる
#   worktrees.directory     repo の中に worktree を置く規約と衝突しうる。使い始めてから決める

onboarding = false

[keys]
prefix = "ctrl+,"
reload_config = "prefix+r"


[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "annotate.capture"
description = "選択範囲に注釈を付ける"

[[keys.command]]
key = "prefix+shift+a"
type = "plugin_action"
command = "annotate.copy-context"
description = "注釈をまとめて context として写す"

[[keys.command]]
key = "prefix+shift+o"
type = "plugin_action"
command = "annotate.last"
description = "エージェントの直前の返答をレビューして返す"

[[keys.command]]
key = "prefix+i"
type = "plugin_action"
command = "annotate.open"
description = "このフォルダの文書をレビューする"

[[keys.command]]
key = "prefix+shift+m"
type = "plugin_action"
command = "annotate.manage"
description = "注釈の一覧"

[theme]
name = "catppuccin"

[theme.custom]
accent = "#c6a0f6"
panel_bg = "#24273a"
green = "#a6da95"
yellow = "#eed49f"
red = "#ed8796"
blue = "#8aadf4"


[ui]
sidebar_width = 32
prompt_new_workspace_name = true
show_agent_labels_on_pane_borders = false
confirm_close = true

agent_panel_sort = "priority"
status_indicators = "symbols"

[ui.toast]
delivery = "herdr"

[ui.toast.herdr]
position = "bottom-right"

[ui.sound]
enabled = false

[experimental]
kitty_graphics = true
